name: Bug report
description: A tool failed or returned wrong data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste your bot token. Remove chat ids, names, message text and anything else you don't want public.
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Which tool, e.g. bot_wait_for_reply
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Arguments and result
      description: The arguments the agent sent and the error or wrong output.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: e.g. what the Bale app shows for the same chat
  - type: input
    id: client
    attributes:
      label: MCP client and OS
      placeholder: Claude Desktop 1.x on Windows 11
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Direct, no VPN
        - VPN or proxy
        - BALE_MCP_PROXY set
  - type: input
    id: version
    attributes:
      label: bale-mcp version
      placeholder: "0.1.0"
